name: Build Windows (EasySSH v4)
on:
  push:
    branches: [v4-dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo build release
        working-directory: src-tauri
        run: cargo build --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $out = "EasySSH-v4-win64"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item src-tauri/target/release/easyssh.exe "$out/EasySSH.exe"
          # WebView2 Loader: tauri 静态链接(默认无需 dll)；缺失运行时的机器由系统引导安装
          Compress-Archive -Path "$out/*" -DestinationPath "EasySSH-v4-win64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: easyssh-v4-win64
          path: EasySSH-v4-win64-portable.zip
