[package]
name = "easyssh"
version = "4.3.1"
description = "EasySSH - Portable SSH terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
async-trait = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
easyssh-core = { path = "../crates/easyssh-core" }
tauri-plugin-dialog = "2"
# v4.3.1 健壮性：单实例——二次启动唤起既有窗口，避免双开写坏 config.json
tauri-plugin-single-instance = "2"
ureq = "2"
rand = "0.8"
ctr = "0.9"
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# v4.3.0 健壮性强化：abort → unwind。abort 使任何 Rust panic 直接闪退（会话/传输全部丢失）；
# unwind 允许 panic 被捕获并记录，代价约 +1~2MB 包体（20MB 红线内可控）。
# panic = "abort"

