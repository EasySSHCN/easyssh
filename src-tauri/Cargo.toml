[package]
name = "easyssh"
version = "5.2.7"
description = "EasySSH - Portable SSH terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# R-20261122-002：libfko（fwknop 2.6.10，vendor 于 src-tauri/vendor-libfko/）C 源静态编译
cc = "1"

# v5(M1)/F-M1-01：升级清单离线 Ed25519 签名工具（发布机使用；客户端不打包该 bin）
[[bin]]
name = "essh-sign"
path = "src/bin/essh-sign.rs"

# R-20261122-002：SPA 互通真机回归入口（仅回归使用；发布构建可排除）
[[bin]]
name = "spa_emit"
path = "src/bin/spa_emit.rs"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
async-trait = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
easyssh-core = { path = "../crates/easyssh-core" }
tauri-plugin-dialog = "2"
# v4.3.1：凭据加密存储——密钥派生自机器指纹，密文落 config.json
tauri-plugin-single-instance = "2"
ureq = "2"
rand = "0.8"
ctr = "0.9"
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10" # v5.2.0/F-R10-14:PPK v2 Private-MAC(HMAC-SHA1) 校验
base64 = "0.22"
# v5.3/R-20261120-005(②)：客户端网关接入——WSS 隧道 + rustls TLS（自签名可放行）
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots", "connect"] }
rustls = "0.22"
tokio-rustls = "0.25"
rustls-native-certs = "0.7"
webpki-roots = "0.26"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# v5(M1)/F-M1-01：OTA 升级清单 Ed25519 验签
ed25519-dalek = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# v4.3.0 起：panic 策略保持默认 unwind（Rust panic 保留栈回溯），abort 已移除
# panic = "abort"
