[package]
name = "easyssh-core"
version = "4.3.1"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
# v5(M1)/F-M1-01：OTA 升级清单 Ed25519 签名/验签
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
